apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    app: {{ .Release.Name }}-postgres
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-postgres
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          args: {{ toYaml .Values.postgres.args | nindent 12 }}
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: POSTGRES_DB
            # The official image refuses to initialise into a non-empty directory, and a
            # local-path volume arrives with a lost+found. Initialising a subdirectory sidesteps
            # that without needing the volume to be pristine.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: shm
              mountPath: /dev/shm
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            # Generous on purpose: a restart mid-recovery forces crash recovery on the next start,
            # which takes longer still and restarts again before finishing, a self-perpetuating
            # spiral. Give WAL replay genuine room rather than racing it.
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 10
          resources: {{ toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: shm
          # Postgres puts parallel query and hash join scratch here, and the image's default
          # 64MB is too small for the sort volume this workload produces. Counts against the
          # container memory limit, so it is sized well under it.
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
