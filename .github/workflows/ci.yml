name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Overrides .cargo/config.toml's target-cpu=native: the build cache is shared across runners
  # with different CPUs, so native-built artifacts restored onto another one would fault.
  RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

jobs:
  rust-quality:
    name: Rust Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            cargo fmt --all -- --check
          else
            cargo fmt --all -- --check || echo "::warning::Rust formatting issues found (not failing on push)"
          fi

      - name: Install cargo-machete
        uses: taiki-e/install-action@cargo-machete

      - name: Check for unused dependencies
        run: cargo machete

      - name: Clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

      # serve-assets gates ~300 lines that --all-features always compiles in; this is
      # the only job that proves the feature-off build still builds.
      - name: Check no-default-features build
        run: cargo check --no-default-features

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: web
        run: bun ci --frozen-lockfile

      - name: Sync SvelteKit
        working-directory: web
        run: bunx svelte-kit sync

      - name: Check formatting
        working-directory: web
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bun run format:check
          else
            bun run format:check || echo "::warning::Frontend formatting issues found (not failing on push)"
          fi

      - name: Type check
        working-directory: web
        run: bun run typecheck

      - name: Lint
        working-directory: web
        run: bun run lint:ci

  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: banner
          POSTGRES_PASSWORD: banner
          POSTGRES_DB: banner
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://banner:banner@localhost:5432/banner
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Run tests
        run: cargo nextest run --no-default-features

      - name: Install sqlx-cli
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      # A query-text change already fails the offline build on a hash mismatch.
      # This catches the other half: a migration that changes a column's type or
      # nullability while every query stays byte-identical.
      - name: Verify .sqlx matches the live schema
        env:
          SQLX_OFFLINE: "false"
        run: |
          cargo sqlx migrate run
          cargo sqlx prepare --check

  bindings-check:
    name: Bindings Up To Date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Regenerate bindings
        run: bunx @xevion/tempo bindings

      # Staged rather than a bare diff so an added or deleted binding counts too.
      - name: Fail if the committed bindings are stale
        run: |
          git add -A web/src/lib/bindings
          git diff --cached --exit-code -- web/src/lib/bindings

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: web
        run: bun ci --frozen-lockfile

      - name: Sync SvelteKit
        working-directory: web
        run: bunx svelte-kit sync

      - name: Run tests
        working-directory: web
        run: bun run test

  frontend-stories:
    name: Frontend Stories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: web
        run: bun ci --frozen-lockfile

      - name: Sync SvelteKit
        working-directory: web
        run: bunx svelte-kit sync

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}

      - name: Install Chromium
        working-directory: web
        run: bunx playwright install --with-deps chromium

      - name: Run stories
        working-directory: web
        run: bun run storybook:test

  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: web
        run: bun ci --frozen-lockfile

      - name: Sync SvelteKit
        working-directory: web
        run: bunx svelte-kit sync

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}

      - name: Install Chromium
        working-directory: web
        run: bunx playwright install --with-deps chromium

      # Builds the app, serves the adapter-node output and drives it in a real
      # browser, so bundling faults that only exist in the built output fail here.
      - name: Run end-to-end tests
        working-directory: web
        run: bun run test:e2e

      # Without this a failure is a bare assertion message; the report carries
      # the trace, and the trace is what makes a browser failure readable.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A tag on the image the deploy already publishes, so GITHUB_TOKEN never has to
      # create a package. type=gha shares one 10GB/repo budget with every cache here.
      # Only master writes the tag: a fork PR's token is read-only, and an export it
      # cannot authorize fails the whole build. An unreadable import is only a warning.
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          build-args: |
            CARGO_CACHE=layer
            TARGET_CPU=x86-64
          cache-from: type=registry,ref=ghcr.io/xevion/banner:buildcache
          cache-to: ${{ github.event_name == 'push' && 'type=registry,ref=ghcr.io/xevion/banner:buildcache,mode=max' || '' }}

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the baseline is scanned from a worktree

      - uses: Xevion/advisory-action@65367754036089d12a5847a6e4d87f10f3d2d814 # v1

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The only job that reads mise.toml; every other job pins its toolchain through a
      # dedicated action. Tool versions for the docs gate live in one place as a result.
      # Scoped: mise.toml also pins bun, helm, kubectl and the rest, none of which this job
      # needs. node comes along because markdownlint-cli2 resolves through the npm backend.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: node dprint markdownlint-cli2 lychee

      - name: Format
        run: dprint check -c .config/dprint.json

      - name: Lint
        run: markdownlint-cli2 --config .config/markdownlint.jsonc

      # Offline: relative links are resolved against the tree, so a moved file fails here.
      - name: Links
        run: lychee -c .config/lychee.toml --offline --no-progress README.md 'docs/**/*.md'
