# Bounds the shared docker-container builder's cache. This is the single source of truth for the
# `ci` builder: bf4-emblems builds on the same host and the same builder, and its copy of this file
# is a pointer back here. The --config flag only applies when the builder is created, so editing
# this file changes nothing until the builder is recreated:
#
#     docker buildx rm ci
#
# The next deploy recreates it from this file, at the cost of one cold build.
#
# Both projects now mount the cargo registry, git checkouts and target dir as cache mounts
# (exec.cachemount), so that is where nearly all the reusable weight lives and it gets the larger
# budget. The registry and git mounts are keyed by path and therefore shared between the two
# projects; each keeps its own target mount (/app/target for banner, /build/target for bf4).
#
# Regular image layers hold much less now that neither build bakes a target dir into a layer, so
# the catch-all rule is the smaller of the two. The earlier split was the reverse of this and was
# sized for a banner that had no cache mounts at all.
#
# Combined ceiling is ~44GB, against ~60GB free on /mnt/data with Postgres sharing the volume.
[worker.oci]
  gc = true

  [[worker.oci.gcpolicy]]
    keepDuration = "168h"
    reservedSpace = "16GB"
    maxUsedSpace = "28GB"
    filters = ["type==source.local", "type==exec.cachemount", "type==source.git.checkout"]

  [[worker.oci.gcpolicy]]
    all = true
    reservedSpace = "8GB"
    maxUsedSpace = "16GB"
