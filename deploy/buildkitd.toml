# Bounds the shared docker-container builder's cache. Two Rust projects now build here, and they
# land in different budgets: bf4-emblems mounts cargo registry/git/target as cache mounts
# (exec.cachemount), while banner relies entirely on cargo-chef layer caching (regular).
#
# The stock split was backwards for that workload. Measured with bf4 alone at 7.19GB resident,
# exec.cachemount held 469MB against a 24GB budget while regular layers held 6.72GB against 16GB.
# Banner's first build then added ~7.1GB, all of it regular, taking the total to 14.33GB and
# leaving the tighter budget nearly full while the larger one sat almost untouched. Without this
# rebalance the two projects evict each other's layers on alternating builds.
#
# Combined ceiling is ~40GB against 64GB free on /mnt/data.
[worker.oci]
  gc = true

  [[worker.oci.gcpolicy]]
    keepDuration = "168h"
    reservedSpace = "8GB"
    maxUsedSpace = "12GB"
    filters = ["type==source.local", "type==exec.cachemount", "type==source.git.checkout"]

  [[worker.oci.gcpolicy]]
    all = true
    reservedSpace = "16GB"
    maxUsedSpace = "28GB"
